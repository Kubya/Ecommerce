<div class="container-fluid" style="background-color: rgb(63, 58, 58);">
    <div class="row justify-content-center text-center">
        <div class="col-md-8 col-lg-6">
            <div class="header d-flex align-items-center" style="height: 60px; position: relative;">
                <h3 style="color: white; font-size: 23px; margin: 0 auto; position: absolute; left: 0; right: 0; text-align: center; width: 100%;">Popular E-commerce Product</h3>
                <span style="position: absolute; right: 1px;  z-index: 1;">
                    <i class="fas fa-shopping-cart" style="color: rgb(220, 183, 88); font-size: 25px; cursor: pointer;">&nbsp;{{cartCount}}</i>
                </span>
            </div>
        </div>
    </div>
</div>
