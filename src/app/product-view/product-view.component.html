<div class="container-fluid" style="background-color: rgb(105, 96, 96);" >
    <div class="row">
        <div class="col-md-2 mt-3" *ngFor=" let item of data?.products" >
            <div class="card mt-2">
                <div class="card-body">
                    <div class="card-img-action">
                        <img routerLink='/product-details/{{item.id}}' src="{{item.thumbnail}}" class="card-img img-fluid" alt="">
                    </div>
                </div>
                <div class="card-body bg-light text-center">
                    <h6 class="font-weight-semibold">
                       <a href=""> {{item.title}}</a>
                    </h6>
                    <h3 class="mb-0 font-weight-semibold">$  {{item.price}}</h3>
                    <button routerLink='/product-details/{{item.id}}' class="btn btn-sm btn-dark mt-2"> <i class=" fa fa-solid fa-info mr-2" ></i>&nbsp;  View detaile</button>
                    <button  (click)="addCart(item)" class="btn btn-sm btn-warning mt-2"> <i class="fa fa-solid fa-cart-plus mr-2"></i>&nbsp; Add to cart</button>
                    <button (click)="removeItem(item)" class="btn btn-sm btn-danger mt-2"> <i class="fa fa-solid fa-remove mr-2"></i>&nbsp; Remove cart</button>
                </div>

            </div>
        </div>
    </div>
</div>
